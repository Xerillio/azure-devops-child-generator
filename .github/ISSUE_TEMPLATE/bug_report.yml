name: Bug report
description: Report a reproducible problem with the project.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can so we can reproduce and find a fix for it.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One sentence describing the bug.
      placeholder: e.g. I can't select the template I just created
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Azure DevOps and project that are relevant to this issue.
      value: |
        - Extension version:
        - Hosting type: Azure DevOps Services / Azure DevOps Server
        - Project details:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any relevant log snippets, stack traces, or diagnostics.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, sample configuration, links, or anything else that might help.
    validations:
      required: false
